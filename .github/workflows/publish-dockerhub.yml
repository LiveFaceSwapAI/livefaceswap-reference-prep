name: Publish container to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cabbagehao/livefaceswap-reference-prep:latest
            cabbagehao/livefaceswap-reference-prep:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/LiveFaceSwapAI/livefaceswap-reference-prep
            org.opencontainers.image.url=https://livefaceswap.ai/
            org.opencontainers.image.title=LiveFaceSwap AI Face Swap Reference Image Prep
            org.opencontainers.image.description=Prepare authorized portrait reference images for LiveFaceSwap AI face swap workflows
            org.opencontainers.image.licenses=MIT
